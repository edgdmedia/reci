name: Package Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    name: Build theme package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make packaging script executable
        run: chmod +x ./scripts/package-theme.sh

      - name: Package theme from committed main
        run: ./scripts/package-theme.sh

      - name: Upload packaged theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: reci-media-hub-package
          path: dist/*.zip
          if-no-files-found: error

      # Future enhancement: publish release-manifest JSON and zip to GitHub Releases
      # so the custom theme updater can fetch version metadata and download URLs.
